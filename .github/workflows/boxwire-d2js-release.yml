# Builds D2.js from this fork and attaches the npm tarball to a GitHub prerelease,
# so Boxwire can depend on it by URL without an npm account.
#
#   git tag boxwire-d2js-v0.1.34-bw.1 <commit> && git push origin boxwire-d2js-v0.1.34-bw.1
#
# The tag's commit is what gets built; the part after "boxwire-d2js-v" becomes the
# package version. Nothing is published to npm.
name: Boxwire D2.js release

on:
  push:
    tags:
      - boxwire-d2js-v*

permissions:
  contents: write

concurrency:
  group: boxwire-d2js-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Bun
        run: |
          # Same lookup as d2js/js/make.sh: the "bun" entry in package.json.
          npm install --global "bun@$(awk -F'"' '$2 == "bun" { print $4 }' d2js/js/package.json)"
          bun --version

      - name: Read the version from the tag
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#boxwire-d2js-v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like boxwire-d2js-v0.1.34-bw.1" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Build the WASM module
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          GOOS=js GOARCH=wasm go build \
            -ldflags="-s -w -X github.com/d2lang/d2/lib/version.Version=$(git rev-parse --short HEAD) -X github.com/d2lang/d2/d2js/d2wasm.jsVersion=${VERSION}" \
            -trimpath -o d2js/js/wasm/d2.wasm ./d2js
          ls -l d2js/js/wasm/d2.wasm

      - name: Build and pack the package
        working-directory: d2js/js
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun build.js
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm pack
          ls -l ./*.tgz

      - name: Smoke test the built package
        working-directory: d2js/js
        run: |
          node --input-type=module -e '
            import { D2 } from "./dist/node-esm/index.js";
            const d2 = new D2();
            for (const layout of ["dagre", "elk", "tala"]) {
              const res = await d2.compile("a -> b\nb: {top: 10; left: 300}\n", { layout });
              if (res.diagram.shapes.length !== 2) throw new Error(layout + ": wrong shape count");
              await d2.render(res.diagram);
            }
            console.log("ok");
            process.exit(0);
          '

      - name: Create the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tarball=$(ls d2js/js/*.tgz)
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$tarball")"
          gh release create "$GITHUB_REF_NAME" "$tarball" \
            --prerelease \
            --verify-tag \
            --title "D2.js ${VERSION} for Boxwire" \
            --notes "D2.js built from ${GITHUB_SHA} of ${GITHUB_REPOSITORY}. Install it with:

          \`\`\`sh
          pnpm add \"@d2lang/d2@${url}\"
          \`\`\`"
