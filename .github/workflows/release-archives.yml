name: Release archives

# Archives for every platform and the D2.js tarball are built for release tags,
# and for pull requests that change the release machinery (as v0.0.0-pr.N,
# without a draft). master pushes still build and size-check a representative
# archive in ci.yml.
on:
  pull_request:
    paths:
      - .github/workflows/release-archives.yml
      - .github/workflows/windows-msi.yml
      - ci/release/**
      - d2js/js/ci/**
      - d2js/js/package.json
      - d2js/js/package-lock.json
  push:
    tags:
      - v*

permissions:
  contents: read

concurrency:
  group: release-archives-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    if: github.event_name == 'push'
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_BUILD_SERIAL: "1"
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      windows_sha256: ${{ steps.archives.outputs.windows_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
          cache: true

      - name: Select release version
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version=$GITHUB_REF_NAME
            if ! printf '%s\n' "$version" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'; then
              echo "release tag must be a v-prefixed semantic version" >&2
              exit 1
            fi
          else
            version="v0.0.0-pr.$PR_NUMBER"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Verify modules
        env:
          GOEXPERIMENT: ""
          GOFLAGS: ""
          GOTOOLCHAIN: local
          GOWORK: "off"
        run: go mod verify

      - name: Build and verify all release archives
        env:
          RELEASE: "1"
          RELEASE_BUILD_IN_CI: "1"
          VERSION: ${{ steps.version.outputs.version }}
        run: ./ci/release/build.sh --rebuild --version="$VERSION"

      - name: Prove archive reproducibility
        env:
          RELEASE: "1"
          RELEASE_BUILD_IN_CI: "1"
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cp "ci/release/build/$VERSION/SHA256SUMS" "$RUNNER_TEMP/first-SHA256SUMS"
          ./ci/release/build.sh --rebuild --version="$VERSION"
          diff -u "$RUNNER_TEMP/first-SHA256SUMS" "ci/release/build/$VERSION/SHA256SUMS"
          git diff --exit-code

      - name: Record Windows archive checksum
        id: archives
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          digest=$(sha256sum "ci/release/build/$VERSION/d2-$VERSION-windows-amd64.tar.gz" | cut -d ' ' -f 1)
          echo "windows_sha256=$digest" >>"$GITHUB_OUTPUT"

      - name: Generate release SBOM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          GOTOOLCHAIN=local GOWORK=off GOFLAGS= GOEXPERIMENT= \
            go run -mod=readonly ./ci/release/releasetool sbom \
              --binary "ci/release/build/$VERSION/linux-amd64/d2-$VERSION/bin/d2" \
              --output "$RUNNER_TEMP/d2.spdx.json" \
              --name "d2-$VERSION" \
              --version "$VERSION" \
              --epoch "$(git show -s --format=%ct HEAD)"

      - name: Upload immutable release archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-archives
          path: |
            ci/release/build/${{ steps.version.outputs.version }}/*.tar.gz
            ci/release/build/${{ steps.version.outputs.version }}/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload release SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom
          path: ${{ runner.temp }}/d2.spdx.json
          if-no-files-found: error
          retention-days: 30

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
            extension: ""
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            extension: ""
          - runner: macos-15-intel
            os: macos
            arch: amd64
            extension: ""
          - runner: macos-15
            os: macos
            arch: arm64
            extension: ""
          - runner: windows-2025
            os: windows
            arch: amd64
            extension: .exe
          - runner: windows-11-arm
            os: windows
            arch: arm64
            extension: .exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-archives
          path: ${{ runner.temp }}/release-archives

      - name: Run native archive smoke test
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
          BINARY_EXTENSION: ${{ matrix.extension }}
          OS: ${{ matrix.os }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "release-archives/d2-$env:VERSION-$env:OS-$env:ARCH.tar.gz"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "missing $archive"
          }
          $destination = Join-Path $env:RUNNER_TEMP "d2-release-smoke"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          tar -C $destination -xzf $archive
          if ($LASTEXITCODE -ne 0) {
            throw "unable to extract $archive"
          }
          $binary = Join-Path $destination "d2-$env:VERSION/bin/d2$env:BINARY_EXTENSION"
          $actualVersion = (& $binary --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualVersion -cne $env:VERSION) {
            throw "d2 --version returned '$actualVersion', expected '$env:VERSION'"
          }
          $inputFile = Join-Path $destination "smoke.d2"
          $outputFile = Join-Path $destination "smoke.svg"
          "x -> y" | Set-Content -LiteralPath $inputFile
          & $binary $inputFile $outputFile
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $outputFile -PathType Leaf)) {
            throw "d2 SVG smoke render failed"
          }
          if (-not (Select-String -LiteralPath $outputFile -Pattern '<svg' -Quiet)) {
            throw "d2 SVG smoke render did not produce SVG"
          }
          $talaOutputFile = Join-Path $destination "smoke-tala.svg"
          & $binary --layout=tala $inputFile $talaOutputFile
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $talaOutputFile -PathType Leaf)) {
            throw "d2 TALA SVG smoke render failed"
          }
          if (-not (Select-String -LiteralPath $talaOutputFile -Pattern '<svg' -Quiet)) {
            throw "d2 TALA SVG smoke render did not produce SVG"
          }
          $pngFile = Join-Path $destination "smoke.png"
          & $binary $inputFile $pngFile
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $pngFile -PathType Leaf)) {
            throw "d2 PNG smoke render failed"
          }
          $pngBytes = [System.IO.File]::ReadAllBytes($pngFile)
          if ($pngBytes.Length -lt 8 -or [System.BitConverter]::ToString($pngBytes, 0, 8) -cne '89-50-4E-47-0D-0A-1A-0A') {
            throw "d2 PNG smoke render did not produce PNG"
          }

  # The MSI needs the repository owner to accept the WiX 7 EULA. d2lang/d2 tag
  # pushes still require it; elsewhere the MSI is skipped until the owner sets
  # WIX7_EULA_ACCEPTED=true, and the release goes out without it.
  msi:
    needs: [build, smoke]
    if: (github.repository == 'd2lang/d2' && github.event_name != 'pull_request') || vars.WIX7_EULA_ACCEPTED == 'true'
    uses: ./.github/workflows/windows-msi.yml
    with:
      version: ${{ needs.build.outputs.version }}
      commit: ${{ needs.build.outputs.commit }}
      archive_sha256: ${{ needs.build.outputs.windows_sha256 }}

  # Builds D2.js from the tagged source like npm-stage.yml's pack job and keeps
  # the @d2lang/d2 tarball as d2js-<version>.tgz for the release. Nothing is
  # published to npm.
  d2js:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Select versions
        id: version
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          npm_version=$(node -p "require('./d2js/js/package.json').version")
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            version=$GITHUB_REF_NAME
            # Keep the annotated tag, which the WASM reports as its D2 version.
            git fetch --force --no-tags origin "refs/tags/$version:refs/tags/$version"
            d2_version=$version
            if [[ "$(git describe --exact-match)" != "$version" ]]; then
              echo "release tag $version must be an annotated tag on this commit" >&2
              exit 1
            fi
            # A fork release vX.Y.Z-nl.N ships D2.js A.B.C-nl.N.
            if [[ "$version" =~ -nl\.[0-9]+$ && "${npm_version##*-}" != "${version##*-}" ]]; then
              echo "d2js/js/package.json is $npm_version; fork release $version needs a -${version##*-} D2.js version" >&2
              exit 1
            fi
          else
            version="v0.0.0-pr.$PR_NUMBER"
            d2_version=$(git rev-parse --short HEAD)
          fi
          {
            echo "version=$version"
            echo "d2_version=$d2_version"
            echo "npm_version=$npm_version"
          } >>"$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ./go.mod
          cache: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install supported npm and Bun
        run: |
          npm install --global npm@12.0.2 bun@1.3.14
          npm --version
          bun --version

      - name: Install binaryen
        run: |
          BINARYEN_VERSION="version_131"
          BINARYEN_SHA256="b5bf1f0eaf17c63ee588ff7a5954dc8f6ce2c26989051c66f24dfe9ece3e46db"
          BINARYEN_ARCHIVE="$RUNNER_TEMP/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          curl -fsSL \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            -o "$BINARYEN_ARCHIVE"
          echo "$BINARYEN_SHA256  $BINARYEN_ARCHIVE" | sha256sum --check --strict
          tar -xzf "$BINARYEN_ARCHIVE" -C "$RUNNER_TEMP"
          sudo cp "$RUNNER_TEMP/binaryen-${BINARYEN_VERSION}"/bin/* /usr/local/bin/
          wasm-opt --version

      - name: Build, test, and pack D2.js
        env:
          NPM_PACKAGE_TARGET: both
          NPM_PACK_DIR: ${{ runner.temp }}/npm-packages
          NPM_PUBLISH_MODE: pack
          NPM_VERSION: ${{ steps.version.outputs.npm_version }}
        run: |
          cd d2js/js
          bun install --frozen-lockfile
          ./ci/build.sh
          bun run test:all
          git diff --exit-code

      - name: Check the package and name it for the release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          D2_VERSION: ${{ steps.version.outputs.d2_version }}
        run: |
          ./ci/release/d2js-package.sh "$RUNNER_TEMP/npm-packages" "$VERSION" "$D2_VERSION" "$RUNNER_TEMP/d2js-package"
          ls -l "$RUNNER_TEMP/d2js-package" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload the D2.js tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: d2js-package
          path: ${{ runner.temp }}/d2js-package/d2js-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  attest:
    # Runs without the MSI when the msi job was skipped, never when it failed.
    if: >-
      !cancelled() && github.event_name == 'push' &&
      contains(fromJSON('["d2lang/d2", "NamiLinkLabs/d2"]'), github.repository) &&
      needs.build.result == 'success' && needs.smoke.result == 'success' &&
      needs.tests.result == 'success' && needs.d2js.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.msi.result)
    needs:
      - build
      - smoke
      - msi
      - tests
      - d2js
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-archives
          path: ${{ runner.temp }}/release-archives
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sbom
          path: ${{ runner.temp }}/release-sbom
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: d2js-package
          path: ${{ runner.temp }}/d2js-package

      - name: Attest archive build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-archives/*.tar.gz

      - name: Attest D2.js tarball build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/d2js-package/*.tgz

      - name: Attest archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-archives/*.tar.gz
          sbom-path: ${{ runner.temp }}/release-sbom/d2.spdx.json

      - name: Attest checksum manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-archives/SHA256SUMS

  draft:
    if: >-
      !cancelled() && github.event_name == 'push' &&
      contains(fromJSON('["d2lang/d2", "NamiLinkLabs/d2"]'), github.repository) &&
      needs.build.result == 'success' && needs.smoke.result == 'success' &&
      needs.tests.result == 'success' && needs.d2js.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.msi.result) &&
      needs.attest.result == 'success'
    needs: [build, smoke, msi, tests, d2js, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-archives
          path: ${{ runner.temp }}/release-archives
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.msi.result == 'success'
        with:
          name: windows-msi
          path: ${{ runner.temp }}/windows-msi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sbom
          path: ${{ runner.temp }}/release-sbom
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: d2js-package
          path: ${{ runner.temp }}/d2js-package
      - name: Attach verified artifacts to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
          MSI_RESULT: ${{ needs.msi.result }}
        run: |
          set -euo pipefail
          msi=()
          if [[ "$MSI_RESULT" == success ]]; then
            msi=(--msi "$RUNNER_TEMP/windows-msi/d2-$VERSION-windows-amd64.msi")
          else
            echo "The MSI was not built (WIX7_EULA_ACCEPTED is not true); the draft has no MSI." >>"$GITHUB_STEP_SUMMARY"
          fi
          python3 ci/release/upload-draft.py \
            --repository "$GITHUB_REPOSITORY" --version "$VERSION" --commit "$RELEASE_COMMIT" \
            --archives "$RUNNER_TEMP/release-archives" \
            "${msi[@]}" \
            --d2js "$RUNNER_TEMP/d2js-package/d2js-$VERSION.tgz" \
            --sbom "$RUNNER_TEMP/release-sbom/d2.spdx.json"
